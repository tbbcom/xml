name: One-time TBB source scrub

on:
  push:
    branches:
      - chore/tbb-hard-separation
    paths:
      - .github/workflows/tbb-one-time-separation.yml

permissions:
  contents: write

jobs:
  scrub:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout separation branch
        uses: actions/checkout@v4
        with:
          ref: chore/tbb-hard-separation

      - name: Purge inherited cross-site references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          production_xml = root / 'asset/xml/thebukitbesi.xml'
          if not production_xml.exists():
              raise SystemExit('asset/xml/thebukitbesi.xml not found')

          allowed = {'.xml', '.js', '.json', '.md', '.yml', '.yaml', '.html', '.css', '.txt'}
          replacements = [
              ('asset/xml/ilmualam.xml', 'asset/xml/thebukitbesi.xml'),
              ('ilmualam-fixed.xml', 'thebukitbesi-fixed.xml'),
              ('ilmualam-fixed-theme-xml', 'thebukitbesi-fixed-theme-xml'),
              ('https://www.ilmualam.com', 'https://www.thebukitbesi.com'),
              ('https://ilmualam.com', 'https://thebukitbesi.com'),
              ('www.ilmualam.com', 'www.thebukitbesi.com'),
              ('ilmualam.com', 'thebukitbesi.com'),
              ('Ilmu Alam', 'The Bukit Besi'),
              ('ILMU ALAM', 'THE BUKIT BESI'),
              ('ilmualam-blogger-xml', 'thebukitbesi-blogger-xml'),
              ('IlmuAlamSchemaAudit', 'TheBukitBesiSchemaAudit'),
          ]

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in allowed:
                  continue
              try:
                  text = path.read_text(encoding='utf-8-sig')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          text = production_xml.read_text(encoding='utf-8-sig')
          lines = text.splitlines()
          blocked_fragments = (
              'ilmualam.github.io/pwa/manifest.json',
              'server8.mp3quran.net',
              'cdn.islamic.network',
              'api.alquran.cloud',
              'apis.quran.foundation',
          )
          lines = [line for line in lines if not any(fragment in line for fragment in blocked_fragments)]
          text = '\n'.join(lines) + '\n'

          text = re.sub(r"^.*(?:twitter:site|twitter:creator).*theilmualam.*\n?", '', text, flags=re.I | re.M)
          text = re.sub(
              r"family=Inter:wght@400;500;600;700&amp;family=Noto\+Naskh\+Arabic:wght@400;500;600;700&amp;family=Amiri:wght@400;700&amp;display=swap",
              "family=Inter:wght@400;500;600;700&amp;display=swap",
              text,
          )
          text = text.replace("title='Perkongsian Ilmu Allah dan Sunnah'", "title='The Bukit Besi'")
          text = text.replace('Name:         The Bukit Besi Green', 'Name:         The Bukit Besi')

          forbidden = ('ilmualam.com', 'ilmualam.github.io', 'Ilmu Alam', 'IlmuAlam', 'theilmualam')
          remaining = [item for item in forbidden if item.lower() in text.lower()]
          if remaining:
              raise SystemExit(f'Forbidden cross-site identifiers remain in production XML: {remaining}')
          production_xml.write_text(text, encoding='utf-8')

          # The migration workflow is deliberately one-shot.
          workflow = root / '.github/workflows/tbb-one-time-separation.yml'
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Verify isolated TBB source
        shell: bash
        run: |
          set -euo pipefail
          test -s asset/xml/thebukitbesi.xml
          test ! -e asset/xml/ilmualam.xml
          ! grep -RniE 'ilmualam\.com|ilmualam\.github\.io|Ilmu Alam|IlmuAlam|theilmualam|asset/xml/ilmualam\.xml' \
            asset/xml/thebukitbesi.xml scripts tests .github/workflows package.json package-lock.json
          npm ci
          npm test
          npm run validate

      - name: Commit scrubbed TBB source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- asset/xml/thebukitbesi.xml scripts tests .github/workflows package.json package-lock.json SETUP.md CLAUDE.md README.md docs asset/index.html sitemap.js BLOGGER_TECHNICAL_SEO_AUDIT.md LIVE_SITE_VERIFICATION.md || true
          if git diff --cached --quiet; then
            echo 'No scrub changes to commit.'
            exit 0
          fi
          git commit -m 'chore: purge Ilmu Alam runtime references from TBB'
          git push origin HEAD:chore/tbb-hard-separation
