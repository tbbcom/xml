name: TBB hard-separation scrub

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  scrub:
    if: github.event.pull_request.head.ref == 'chore/tbb-hard-separation' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout TBB separation branch
        uses: actions/checkout@v4
        with:
          ref: chore/tbb-hard-separation
          fetch-depth: 0

      - name: Scrub inherited Ilmu Alam identity from TBB production source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          xml_path = Path('asset/xml/thebukitbesi.xml')
          if not xml_path.exists():
              raise SystemExit('Missing asset/xml/thebukitbesi.xml')

          text = xml_path.read_text(encoding='utf-8-sig')

          # Remove inherited external runtime dependencies that belong to Ilmu Alam.
          text = re.sub(r"^.*ilmualam\.github\.io/pwa/manifest\.json.*\n?", '', text, flags=re.I|re.M)
          text = re.sub(r"^.*ilmualam\.pages\.dev/sw\.js.*\n?", '', text, flags=re.I|re.M)
          for host in ('server8.mp3quran.net', 'cdn.islamic.network', 'api.alquran.cloud', 'apis.quran.foundation'):
              text = re.sub(rf"^.*{re.escape(host)}.*(?:preconnect|dns-prefetch).*\n?", '', text, flags=re.I|re.M)

          # TBB global font only; Arabic fonts belong to the inherited Ilmu Alam shell.
          text = text.replace(
              'family=Inter:wght@400;500;600;700&amp;family=Noto+Naskh+Arabic:wght@400;500;600;700&amp;family=Amiri:wght@400;700&amp;display=swap',
              'family=Inter:wght@400;500;600;700&amp;display=swap'
          )

          # Convert remaining hard-coded site identity references to TBB.
          replacements = (
              ('https://www.ilmualam.com', 'https://www.thebukitbesi.com'),
              ('https://ilmualam.com', 'https://thebukitbesi.com'),
              ('www.ilmualam.com', 'www.thebukitbesi.com'),
              ('ilmualam.com', 'thebukitbesi.com'),
              ('ilmualamcom', 'thebukitbesi'),
              ('ilmualam.github.io', 'tbbcom.github.io'),
              ('Ilmu Alam', 'The Bukit Besi'),
              ('ILMU ALAM', 'THE BUKIT BESI'),
              ('IlmuAlam', 'TheBukitBesi'),
              ('theilmualam', 'thebukitbesi'),
              ('@ilmualam', '@thebukitbesi'),
              ("title='Perkongsian Ilmu Allah dan Sunnah'", "title='The Bukit Besi'"),
              ('Motivasi Islamik', 'Portal Rujukan Malaysia'),
              ('Laman Perkongsian Ilmu & Sunnah', 'The Bukit Besi'),
              ('The The Bukit Besi Green', 'The Bukit Besi'),
              ('The Bukit Besi Green', 'The Bukit Besi'),
          )
          for old, new in replacements:
              text = text.replace(old, new)

          # No inherited Ilmu Alam identifiers are allowed in the production XML.
          forbidden = ('ilmualam', 'ilmualam.com', 'ilmualam.github.io', 'ilmualam.pages.dev')
          remaining = [token for token in forbidden if token.lower() in text.lower()]
          if remaining:
              raise SystemExit(f'Forbidden Ilmu Alam identifiers remain: {remaining}')

          xml_path.write_text(text, encoding='utf-8')

          # Rewrite old production-template path references in repository text files.
          for root in (Path('scripts'), Path('tests'), Path('docs'), Path('.github/workflows')):
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.js','.md','.yml','.yaml','.json','.txt'}:
                      continue
                  try:
                      s = p.read_text(encoding='utf-8-sig')
                  except UnicodeDecodeError:
                      continue
                  n = s.replace('asset/xml/ilmualam.xml', 'asset/xml/thebukitbesi.xml')
                  if n != s:
                      p.write_text(n, encoding='utf-8')
          PY

      - name: Validate TBB production source
        shell: bash
        run: |
          set -euo pipefail
          test -s asset/xml/thebukitbesi.xml
          test ! -e asset/xml/ilmualam.xml
          ! grep -RniE 'ilmualam|asset/xml/ilmualam\.xml' asset/xml/thebukitbesi.xml scripts tests .github/workflows
          npm ci
          npm test
          npm run validate

      - name: Remove one-shot workflow and commit scrub
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tbb-pr-separation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- asset/xml/thebukitbesi.xml scripts tests docs .github/workflows
          if git diff --cached --quiet; then
            echo 'No scrub changes to commit.'
            exit 0
          fi
          git commit -m 'chore: purge Ilmu Alam runtime identity from TBB'
          git push origin HEAD:chore/tbb-hard-separation
