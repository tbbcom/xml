name: TBB Blogger Content Refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run or apply"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply
      manifest:
        description: "TBB manifest path"
        required: true
        default: "content-refresh/manifest.json"
        type: string
      max_posts:
        description: "Maximum posts in this run (1-5)"
        required: true
        default: "1"
        type: string
      confirm_blog_id:
        description: "Required only for apply; must exactly match TBB_BLOGGER_BLOG_ID"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate TBB target and mode
        env:
          TBB_BLOG_URL: ${{ secrets.TBB_BLOGGER_BLOG_URL }}
        run: |
          set -euo pipefail
          if [ "${TBB_BLOG_URL}" != "https://www.thebukitbesi.com/" ] && [ "${TBB_BLOG_URL}" != "https://thebukitbesi.com/" ]; then
            echo "Refusing to run: TBB_BLOGGER_BLOG_URL is missing or not thebukitbesi.com"
            exit 1
          fi
          if [ "${{ inputs.mode }}" != "dry-run" ] && [ "${{ inputs.mode }}" != "apply" ]; then
            echo "Unsupported mode"
            exit 1
          fi

      - name: Generate refresh preview or apply approved TBB update
        env:
          BLOGGER_BLOG_ID: ${{ secrets.TBB_BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.TBB_BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.TBB_BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.TBB_BLOGGER_REFRESH_TOKEN }}
        run: |
          ARGS="--manifest=${{ inputs.manifest }} --max=${{ inputs.max_posts }}"
          if [ "${{ inputs.mode }}" = "apply" ]; then
            ARGS="$ARGS --apply --confirm-blog-id=${{ inputs.confirm_blog_id }}"
          fi
          node scripts/blogger-content-refresh.js $ARGS

      - name: Upload backup and preview
        uses: actions/upload-artifact@v4
        with:
          name: tbb-blogger-content-refresh-${{ inputs.mode }}
          path: reports/blogger-content-refresh/
          if-no-files-found: error
          retention-days: 30
